name = "free-qr-code-creator"
account_id = "c26dbba499d049a1051c152c720cf4c5"
main = "worker/index.js"
compatibility_date = "2024-11-11"

[[routes]]
pattern = "free-qr-code-creator.web-free.site"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = ["/*", "!/assets/qr-libs-*", "!/assets/*.css", "!/favicon.svg"]
